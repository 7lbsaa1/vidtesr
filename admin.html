<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة | منصة الفيديوهات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="brand">⚙️ لوحة الإدارة</div>
    <ul class="nav-links">
      <li><a href="/home">الرئيسية</a></li>
      <li><a href="/admin" class="active">الإدارة</a></li>
    </ul>
    <div style="display: flex; align-items: center; gap: 1rem;">
      <span class="user-badge" id="navAdminName">مسؤول النظام</span>
      <button class="btn-logout" id="logoutBtn">خروج</button>
    </div>
  </nav>

  <div class="container">
    <div class="stats-grid">
      <div class="glass-card stat-card">
        <h3 id="statTotalUsers">0</h3>
        <p>إجمالي الأعضاء المشاركين</p>
      </div>
      <div class="glass-card stat-card">
        <h3 id="statTotalVideos">0</h3>
        <p>إجمالي الفيديوهات</p>
      </div>
      <div class="glass-card stat-card">
        <h3 id="statTodayVideos">0</h3>
        <p>الفيديوهات المرفوعة اليوم</p>
      </div>
    </div>

    <div class="glass-card" style="margin-bottom: 2rem;">
      <div class="form-group" style="margin: 0;">
        <input 
          type="text" 
          id="searchInput" 
          class="form-control" 
          placeholder="ابحث باسم العضو أو اسم الملف..."
        />
      </div>
    </div>

    <div class="videos-grid" id="videosGrid">
      <div class="empty-state glass-card" style="grid-column: 1/-1;">جاري تحميل الفيديوهات...</div>
    </div>
  </div>

  <div class="modal-overlay" id="deleteModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 0.5rem; color: var(--text-main);">تأكيد الحذف</h3>
      <p style="color: var(--text-muted);">هل أنت متأكد من حذف هذا الفيديو؟ لن يمكنك التراجع عن هذا الإجراء.</p>
      <div class="modal-actions">
        <button class="btn-primary" id="cancelDeleteBtn" style="background: #9ca3af;">إلغاء</button>
        <button class="btn-danger" id="confirmDeleteBtn">حذف</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { 
      db, 
      storage, 
      collection, 
      onSnapshot, 
      query, 
      orderBy, 
      deleteDoc, 
      doc, 
      ref, 
      deleteObject, 
      showToast 
    } from "./firebase-config.js";

    // 1. Simple Security Layer for Admin Access
    const currentUser = localStorage.getItem("user_fullname");
    if (!currentUser) {
      window.location.href = "/login";
    }

    // Protection check (Prompt for simple admin key if not verified)
    if (!sessionStorage.getItem("admin_authenticated")) {
      const pin = prompt("يرجى إدخال كلمة مرور الإدارة لدخول هذه الصفحة:");
      if (pin === "admin123" || pin === "123456") {
        sessionStorage.setItem("admin_authenticated", "true");
      } else {
        alert("غير مصرح لك بالدخول إلى لوحة الإدارة.");
        window.location.href = "/home";
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("user_fullname");
      sessionStorage.removeItem("admin_authenticated");
      window.location.href = "/login";
    });

    // 2. Elements & States
    const videosGrid = document.getElementById("videosGrid");
    const searchInput = document.getElementById("searchInput");
    const statTotalUsers = document.getElementById("statTotalUsers");
    const statTotalVideos = document.getElementById("statTotalVideos");
    const statTodayVideos = document.getElementById("statTodayVideos");

    const deleteModal = document.getElementById("deleteModal");
    const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");
    const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");

    let allVideosData = [];
    let videoToDelete = null;

    // 3. Realtime Listener using Firestore onSnapshot
    const videosQuery = query(collection(db, "videos"), orderBy("uploadedAt", "desc"));

    onSnapshot(videosQuery, (snapshot) => {
      allVideosData = [];
      snapshot.forEach((docSnap) => {
        allVideosData.push({ id: docSnap.id, ...docSnap.data() });
      });
      
      updateStats(allVideosData);
      renderVideos(allVideosData);
    }, (error) => {
      showToast("حدث خطأ أثناء جلب الفيديوهات.", "danger");
    });

    // 4. Update Statistics Dashboard
    function updateStats(data) {
      const uniqueUsers = new Set(data.map(v => v.userName));
      statTotalUsers.textContent = uniqueUsers.size;
      statTotalVideos.textContent = data.length;

      const today = new Date().toDateString();
      const todayCount = data.filter(v => {
        if (!v.uploadedAt) return false;
        const date = v.uploadedAt.toDate ? v.uploadedAt.toDate() : new Date(v.uploadedAt);
        return date.toDateString() === today;
      }).length;

      statTodayVideos.textContent = todayCount;
    }

    // 5. Render Videos Function
    function renderVideos(videos) {
      const searchTerm = searchInput.value.trim().toLowerCase();
      const filtered = videos.filter(v => 
        (v.userName && v.userName.toLowerCase().includes(searchTerm)) ||
        (v.fileName && v.fileName.toLowerCase().includes(searchTerm))
      );

      if (filtered.length === 0) {
        videosGrid.innerHTML = `
          <div class="empty-state glass-card" style="grid-column: 1/-1;">
            ${searchTerm ? "لم يتم العثور على نتائج تطابق بحثك" : "لا توجد فيديوهات مرفوعة حتى الآن"}
          </div>`;
        return;
      }

      videosGrid.innerHTML = filtered.map(v => {
        const uploadDate = v.uploadedAt && v.uploadedAt.toDate 
          ? v.uploadedAt.toDate().toLocaleString('ar-EG') 
          : 'حديثاً';
        const formattedSize = (v.fileSize / (1024 * 1024)).toFixed(1) + ' MB';

        return `
          <div class="glass-card video-card">
            <div>
              <div class="video-card-header">
                <div class="user-avatar">${v.userName ? v.userName.charAt(0) : 'U'}</div>
                <div>
                  <h4 style="color: var(--text-main); font-weight: 700;">${v.userName || 'عضو'}</h4>
                  <span style="font-size: 0.75rem; color: var(--text-muted);">${uploadDate}</span>
                </div>
              </div>

              <div class="video-wrapper">
                <video src="${v.downloadURL}" controls preload="metadata"></video>
              </div>

              <div class="video-details">
                <p><strong>الملف:</strong> ${v.fileName}</p>
                <p><strong>الحجم:</strong> ${formattedSize}</p>
              </div>
            </div>

            <div class="action-buttons">
              <button class="btn-primary trigger-watch" data-url="${v.downloadURL}">
                ▶ مشاهدة
              </button>
              <button class="btn-primary download-btn" data-url="${v.downloadURL}" data-name="${v.fileName}" style="background: #10b981;">
                ⬇ تحميل
              </button>
              <button class="btn-danger delete-btn" data-id="${v.id}" data-path="${v.storagePath}">
                حذف
              </button>
            </div>
          </div>
        `;
      }).join('');

      attachEvents();
    }

    // 6. Search Bar Event Listener
    searchInput.addEventListener("input", () => {
      renderVideos(allVideosData);
    });

    // 7. Action Button Handlers (Watch, Download, Delete)
    function attachEvents() {
      // Watch Video Handler
      document.querySelectorAll(".trigger-watch").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const videoUrl = e.currentTarget.getAttribute("data-url");
          window.open(videoUrl, "_blank");
        });
      });

      // Blob Download Handler
      document.querySelectorAll(".download-btn").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const url = e.currentTarget.getAttribute("data-url");
          const name = e.currentTarget.getAttribute("data-name");
          showToast("جاري بدء التحميل...", "success");

          try {
            const response = await fetch(url);
            const blob = await response.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = blobUrl;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);
          } catch (err) {
            window.open(url, "_blank");
          }
        });
      });

      // Delete Modal Handler
      document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          videoToDelete = {
            id: e.currentTarget.getAttribute("data-id"),
            path: e.currentTarget.getAttribute("data-path")
          };
          deleteModal.classList.add("active");
        });
      });
    }

    cancelDeleteBtn.addEventListener("click", () => {
      deleteModal.classList.remove("active");
      videoToDelete = null;
    });

    confirmDeleteBtn.addEventListener("click", async () => {
      if (!videoToDelete) return;

      const { id, path } = videoToDelete;
      deleteModal.classList.remove("active");

      try {
        // Delete file from Firebase Storage
        if (path) {
          const fileRef = ref(storage, path);
          await deleteObject(fileRef).catch(() => {});
        }

        // Delete Document from Firestore
        await deleteDoc(doc(db, "videos", id));
        showToast("تم حذف الفيديو بنجاح", "success");
      } catch (err) {
        showToast("حدث خطأ أثناء تنفيذ الحذف", "danger");
      } finally {
        videoToDelete = null;
      }
    });
  </script>
</body>
</html>
