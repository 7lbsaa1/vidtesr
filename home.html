<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية - رفع الفيديو</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <nav class="bg-white shadow-md px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-indigo-600">منصة رفع الفيديوهات</h1>
        <div class="space-x-4 space-x-reverse">
            <a href="/home" class="text-gray-600 hover:text-indigo-600 font-medium">الرئيسية</a>
            <a href="/admin" class="text-gray-600 hover:text-indigo-600 font-medium">لوحة التحكم (Admin)</a>
        </div>
    </nav>

    <div class="max-w-xl mx-auto mt-10 bg-white p-8 rounded-2xl shadow-xl">
        <h2 id="welcomeUser" class="text-xl font-bold text-gray-800 mb-4">أهلاً بك</h2>
        
        <div class="bg-indigo-50 border-r-4 border-indigo-600 p-4 mb-6 rounded-lg">
            <h3 class="font-semibold text-indigo-900 mb-1">سؤال إبراهيم:</h3>
            <p class="text-indigo-700">ما هي أهم التحديات التي واجهتك أثناء تطوير المشروع، وكيف تغلبت عليها؟</p>
        </div>

        <form id="uploadForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">اسم الفيديو / العنوان</label>
                <input type="text" id="videoTitle" required placeholder="مثال: إجابة السؤال الأول" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">اختر ملف الفيديو</label>
                <input type="file" id="videoFile" accept="video/*" required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-300 shadow-lg">
                رفع الفيديو
            </button>
        </form>

        <div id="loading" class="hidden mt-4 text-center text-indigo-600 font-medium">
            جاري رفع الفيديو وحفظ البيانات... يرجى الانتظار.
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFwusZ60ZdCwNfg__YrMA6Ww25jeBOiDk",
            authDomain: "vid1-e2c7d.firebaseapp.com",
            projectId: "vid1-e2c7d",
            storageBucket: "vid1-e2c7d.firebasestorage.app",
            messagingSenderId: "323883326794",
            appId: "1:323883326794:web:e1254b899aefa6584175b3",
            measurementId: "G-GQHZRYG3B0"
        };

        const app = initializeApp(firebaseConfig);
        const storage = getStorage(app);
        const db = getFirestore(app);

        const userName = localStorage.getItem('userName');
        if (!userName) {
            window.location.href = '/login';
        } else {
            document.getElementById('welcomeUser').innerText = `أهلاً بك، ${userName}`;
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('videoTitle').value;
            const fileInput = document.getElementById('videoFile');
            const file = fileInput.files[0];

            if (!file) return;

            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            submitBtn.disabled = true;
            loading.classList.remove('hidden');

            try {
                // 1. رفع الفيديو إلى Firebase Storage
                const storageRef = ref(storage, `videos/${Date.now()}_${file.name}`);
                const snapshot = await uploadBytes(storageRef, file);
                const downloadURL = await getDownloadURL(snapshot.ref);

                // حساب حجم الملف بالميجابايت
                const sizeMB = (file.size / (1024 * 1024)).toFixed(2) + ' MB';

                // 2. حفظ بيانات الفيديو في Firestore
                await addDoc(collection(db, "videos"), {
                    userName: userName,
                    title: title,
                    videoUrl: downloadURL,
                    size: sizeMB,
                    createdAt: serverTimestamp()
                });

                alert('تم رفع الفيديو بنجاح!');
                window.location.href = '/admin';
            } catch (error) {
                console.error("خطأ أثناء الرفع: ", error);
                alert('حدث خطأ أثناء رفع الفيديو.');
            } finally {
                submitBtn.disabled = false;
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
