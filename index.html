<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | منصة الفيديوهات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="justify-content: center; align-items: center;">

  <div class="glass-card" style="width: 100%; max-width: 420px; text-align: center;">
    <h1 style="color: var(--primary-color); font-size: 1.8rem; margin-bottom: 0.5rem;">مرحباً بك</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">سجّل اسمك للمتابعة إلى المنصة</p>

    <form id="loginForm">
      <div class="form-group" style="text-align: right;">
        <label for="fullName">الاسم الثنائي</label>
        <input 
          type="text" 
          id="fullName" 
          class="form-control" 
          placeholder="اكتب اسمك الثنائي (مثال: أحمد محمد)"
          required
        />
      </div>
      <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">دخول</button>
    </form>
  </div>

  <script type="module">
    import { showToast } from "./firebase-config.js";

    // Re-check if already logged in
    if (localStorage.getItem("user_fullname")) {
      window.location.href = "/home";
    }

    const loginForm = document.getElementById("loginForm");
    const fullNameInput = document.getElementById("fullName");

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const rawName = fullNameInput.value.trim().replace(/\s+/g, ' ');
      const nameParts = rawName.split(" ");

      if (nameParts.length < 2 || nameParts[0].length < 2 || nameParts[1].length < 2) {
        showToast("يرجى إدخال اسم ثنائي صحيح مكون من كلمتين على الأقل.", "danger");
        return;
      }

      localStorage.setItem("user_fullname", rawName);
      showToast("تم الدخول بنجاح! جاري التوجيه...", "success");
      setTimeout(() => {
        window.location.href = "/home";
      }, 1000);
    });
  </script>
</body>
</html>
